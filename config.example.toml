[logo]
source = "builtin"
path = "./logo.png"
width = 22
height = 7
# Set an absolute or ~/ path here to use a custom logo instead.

[images]
enabled = true
protocol = "auto"
# icon_theme = "breeze"

[interface]
language = "auto"
# Use "es" or "en" to override the language detected from the environment.

[launcher]
terminal = []
recent_limit = 12
close_on_launch = false

[applications]
extra_dirs = []
# desktop_dir = "~/Desktop"

[theme]
# Use "terminal" to preserve the terminal's native foreground or background.
background = "terminal"
foreground = "terminal"
muted = "#7f849c"
accent = "#cba6f7"
info = "#89dceb"
border = "#45475a"
error = "#f38ba8"
selection = "#cba6f7"
header_background = "#cba6f7"
header_foreground = "terminal"
launcher_background = "#a6e3a1"
installer_background = "#dc2626"
manager_background = "#dc2626"
launcher_foreground = "#000000"
installer_manager_foreground = "#ffffff"
image_background = "#181825"
border_style = "rounded"
# Right-click outside an application icon to open the in-terminal theme editor.
